<mat-toolbar class="custom-toolbar" *ngIf="verificar()">
  <nav class="nav-left">
    <a mat-button class="nav-btn" routerLink="/notes" routerLinkActive="active">
      <mat-icon>notes</mat-icon>
      <span>Notas</span>
    </a>

    <a mat-button class="nav-btn" routerLink="/notes/nuevo" routerLinkActive="active"
       *ngIf="isAdmin() || isUser()">
      <mat-icon>assignment_ind</mat-icon>
      <span>Asignar tareas</span>
    </a>
  </nav>

  <span class="spacer"></span>

  <button mat-button class="nav-btn user-btn" [matMenuTriggerFor]="menuSalir">
    <mat-icon>person</mat-icon>
    <span>{{ username }}</span>
    <mat-icon class="arrow">arrow_drop_down</mat-icon>
  </button>
</mat-toolbar>

<mat-menu #menuSalir="matMenu" xPosition="before">
  <button mat-menu-item disabled class="role-item">
    <mat-icon>badge</mat-icon>
    <span>Rol: {{ role }}</span>
  </button>
  <button mat-menu-item routerLink="/login" (click)="cerrar()">
    <mat-icon>logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
</mat-menu>

<router-outlet></router-outlet>
