<div class="auth-page">
  <!-- Login floating box -->
  <div class="float-box">
    <h2>Iniciar sesión</h2>

    <!-- Username field -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Usuario</mat-label>
      <input matInput placeholder="Username" [(ngModel)]="username" />
    </mat-form-field>

    <!-- Password field -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Password</mat-label>
      <input type="password" matInput placeholder="Password" [(ngModel)]="password" (keyup.enter)="login()" />
    </mat-form-field>

    <!-- Botones -->
    <div class="actions">
      <button (click)="login()" mat-flat-button color="primary" class="action-btn">Ingresar</button>
      <button [routerLink]="['/newuser']" mat-stroked-button color="primary" class="action-btn">Crear usuario</button>
    </div>
  </div>
</div>
