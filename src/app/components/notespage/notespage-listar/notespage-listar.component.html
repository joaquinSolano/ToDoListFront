<div class="outer-container">
  <div class="widget-container">
    <div *ngFor="let note of notes" class="note-widget">
      <mat-card class="note-card">
        <mat-card-content class="note-body">
          <p class="note-description">{{ note.description }}</p>
        </mat-card-content>

        <footer *ngIf="note.sender?.username && note.sender?.username !== username" class="note-author">
          <mat-icon>send</mat-icon>
          <span>Enviado por: {{ note.sender?.username }}</span>
        </footer>

        <mat-card-actions class="note-actions">
          <button mat-icon-button class="buttonedit"
                  [routerLink]="['ediciones', note.id]"
                  aria-label="Editar nota">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button class="buttondelete"
                  (click)="delete(note.id)"
                  aria-label="Eliminar nota">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
